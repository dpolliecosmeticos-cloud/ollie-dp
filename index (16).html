<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap');
:root{ --paper:#FAEDFF; --card:#ffffff; --ink:#232c33; --steel:#FF502C; --accent:#DBA8E5; --ok:#1F8A52; --warn:#8A6D00; --danger:#E7002A; --line:#EBD4E8; --muted:#78716c; }
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;}
h1,h2{font-family:'Source Serif 4',serif;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);}
th{color:var(--muted);font-weight:500;font-size:12px;}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:6px 8px;}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;font-size:13px;}
button.primary{background:var(--steel);color:#fff;border-color:var(--steel);}
button.link{border:none;background:none;padding:2px;color:var(--muted);}
.card{border:1px solid var(--line);background:var(--card);padding:14px;}
.flex{display:flex;} .wrap{flex-wrap:wrap;} .gap8{gap:8px;} .between{justify-content:space-between;} .center{align-items:center;}
.muted{color:var(--muted);}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border:1px solid;font-size:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.etapa-drag-item{position:relative;transition:all 0.15s ease;}
.etapa-drag-item:hover{background:rgba(255,80,44,0.05) !important;}
.etapa-drag-item:active{cursor:grabbing !important;}
.etapa-drag-item input{border:none;background:transparent;}
.etapa-drag-item input:focus{outline:none;border-bottom:1px solid var(--steel) !important;box-shadow:0 0 0 3px rgba(255,80,44,0.1);}
@media(max-width:700px){.grid4{grid-template-columns:repeat(2,1fr);}}
.bar{height:6px;background:var(--line);position:relative;width:100px;}
.bar>div{position:absolute;inset:0 auto 0 0;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;z-index:50;}
.panel{background:var(--card);border-left:1px solid var(--line);width:100%;max-width:460px;height:100%;overflow:auto;padding:20px;margin-left:auto;}
.modal{background:var(--card);border:1px solid var(--line);width:100%;max-width:400px;padding:20px;margin:auto;}
nav.tabs{display:flex;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--card);overflow-x:auto;}
nav.tabs button{border:none;background:none;padding:12px 2px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;}
nav.tabs button.active{color:var(--steel);border-color:var(--steel);}
.stackbar{display:flex;height:10px;width:100%;overflow:hidden;border:1px solid var(--line);}
.hidden{display:none!important;}
</style>
</head>

const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmt(d){ if(!d) return "—"; const [y,m,dd]=d.split("-"); return dd+"/"+m+"/"+y; }
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/86400000); }

function calcProc(proc, templates){
  const tpl = templates[proc.tipo]; const steps = tpl? tpl.steps : [];
  const total = steps.length;
  const etapas = proc.etapas||{};
  const doneCount = steps.filter(s=> etapas[s.id] && etapas[s.id].done).length;
  const pct = total? doneCount/total : 0;
  const concluido = total>0 && doneCount===total;
  const atrasado = !concluido && !!proc.prazo && proc.prazo < todayISO();
  let status = "Não iniciado"; if(concluido) status="Concluído"; else if(doneCount>0) status="Em andamento";
  const cor = concluido? C.ok : atrasado? C.danger : doneCount>0? C.warn : "#9c9488";
  return {total,doneCount,pct,concluido,atrasado,status,cor};
}

function setorNomes(){ return setoresFull.map(s=>s.nome); }
function setoresParaFilial(filial){
  if(!filial) return setorNomes();
  return setoresFull.filter(s=> !s.filiais || s.filiais.length===0 || s.filiais.includes(filial)).map(s=>s.nome);
}
function optsSetor(filial, selected){
  return '<option value="">—</option>' + setoresParaFilial(filial).map(s=>`<option ${selected===s?'selected':''}>${esc(s)}</option>`).join("");
}
function optsFilial(selected){

}

};

function renderDashboard(){
  const withCalc = processos.map(p=>({p,c:calcProc(p,templates)}));
  const ativos = withCalc.filter(x=>!x.c.concluido);
  const atrasados = withCalc.filter(x=>x.c.atrasado);
  const mesAtual = todayISO().slice(0,7);
  const concluidosMes = withCalc.filter(x=>x.c.concluido && x.p.data_conclusao && x.p.data_conclusao.slice(0,7)===mesAtual).length;
  const progressoMedio = ativos.length? Math.round(ativos.reduce((a,x)=>a+x.c.pct,0)/ativos.length*100):0;
  const concCom = withCalc.filter(x=>x.c.concluido && x.p.data_abertura && x.p.data_conclusao);
  const tempoMedio = concCom.length? Math.round(concCom.reduce((a,x)=>a+daysBetween(x.p.data_abertura,x.p.data_conclusao),0)/concCom.length):null;
  const porTipo = Object.keys(templates).map(t=>{
    const doTipo = withCalc.filter(x=>x.p.tipo===t); if(!doTipo.length) return null;
    const emdia=doTipo.filter(x=>!x.c.concluido&&!x.c.atrasado).length, atr=doTipo.filter(x=>x.c.atrasado).length, conc=doTipo.filter(x=>x.c.concluido).length;
    return {label:templates[t].label, emdia, atr, conc, tot:emdia+atr+conc};
  }).filter(Boolean);
  const hoje = todayISO();
  const emAviso = processos.filter(p=> p.data_inicio_aviso && p.data_fim_aviso && hoje>=p.data_inicio_aviso && hoje<=p.data_fim_aviso);
  return `
  <div class="grid4" style="margin-bottom:20px">
    <button class="card" style="border:none;cursor:pointer;transition:all 0.2s" onmouseover="this.style.background='rgba(255,80,44,0.05)'" onmouseout="this.style.background='var(--card)'" onclick="ui.filtroStatus='nao_iniciado'; ui.view='processos'; render()">
      <p class="muted">Processos ativos</p><p style="font-size:26px;font-weight:600;margin:4px 0 0">${ativos.length}</p>
      <p style="font-size:11px;color:var(--steel);margin:6px 0 0">👆 clique para filtrar</p>
    </button>
    <button class="card" style="border:none;cursor:pointer;transition:all 0.2s;border-color:${atrasados.length?C.danger:'inherit'}" onmouseover="this.style.background='rgba(231,0,42,0.05)'" onmouseout="this.style.background='var(--card)'" onclick="ui.filtroStatus='atrasado'; ui.view='processos'; render()">
      <p class="muted">Atrasados</p><p style="font-size:26px;font-weight:600;margin:4px 0 0;color:${atrasados.length?C.danger:'inherit'}">${atrasados.length}</p>
      <p style="font-size:11px;color:${atrasados.length?C.danger:C.ok};margin:6px 0 0">${atrasados.length?'⚠ clique':'✓ nenhum'}</p>
    </button>
    <button class="card" style="border:none;cursor:pointer;transition:all 0.2s" onmouseover="this.style.background='rgba(31,138,82,0.05)'" onmouseout="this.style.background='var(--card)'" onclick="ui.filtroStatus='concluido'; ui.view='processos'; render()">
      <p class="muted">Concluídos este mês</p><p style="font-size:26px;font-weight:600;margin:4px 0 0">${concluidosMes}</p>
      <p style="font-size:11px;color:var(--ok);margin:6px 0 0">👆 clique para filtrar</p>
    </button>
    <div class="card">
      <p class="muted">Tempo médio de conclusão</p><p style="font-size:26px;font-weight:600;margin:4px 0 0">${tempoMedio==null?"—":tempoMedio+" dias"}</p>
      <p style="font-size:11px;color:var(--muted);margin:6px 0 0">📊 ${concCom.length} processos</p>
    </div>
  </div>
  <div class="card" style="margin-bottom:20px">
    <p class="muted" style="margin:0 0 10px">Processos por tipo</p>
    ${porTipo.map(r=>`<div style="margin-bottom:10px"><div class="flex between" style="font-size:12px;margin-bottom:3px"><span>${esc(r.label)}</span><span class="muted">${r.tot}</span></div><div class="stackbar"><div style="width:${r.emdia/r.tot*100}%;background:${C.warn}"></div><div style="width:${r.atr/r.tot*100}%;background:${C.danger}"></div><div style="width:${r.conc/r.tot*100}%;background:${C.ok}"></div></div></div>`).join("") || '<p class="muted">Sem processos ainda.</p>'}

/* ---------------- processos ---------------- */
function filteredProcessos(){
  return processos.filter(p=>{
    if(ui.filtroTipo!=="todos" && p.tipo!==ui.filtroTipo) return false;
    if(ui.filtroFilial!=="todos" && p.filial!==ui.filtroFilial) return false;
    if(ui.filtroSetor!=="todos" && p.setor!==ui.filtroSetor) return false;
    const st = calcProc(p,templates).status;
    if(ui.filtroStatus!=="todos" && st!==ui.filtroStatus) return false;
    if(ui.filtroAno!=="todos" && (!p.data_abertura || p.data_abertura.slice(0,4)!==ui.filtroAno)) return false;
    if(ui.filtroMes!=="todos" && (!p.data_abertura || p.data_abertura.slice(5,7)!==ui.filtroMes)) return false;
    if(ui.busca && !p.colaborador.toLowerCase().includes(ui.busca.toLowerCase())) return false;
    return true;
  });
}

/* ---------------- afastamentos ---------------- */
function processoAfastamentoDe(colaborador){
  const nome = (colaborador||"").toLowerCase();
  return processos.find(p=> p.tipo==="afastamento" && (p.colaborador||"").toLowerCase()===nome) || null;
}
function contagemPor(list, chave){
  const map = {};
  list.forEach(a=>{ const k = a[chave] || "—"; if(!map[k]) map[k] = {chave:k, qtd:0, dias:0}; map[k].qtd++; map[k].dias += (a.dias||0); });
  return Object.values(map).sort((a,b)=>b.qtd-a.qtd);
}
function renderBarList(rows, corBarra, sufixo){
  if(!rows.length) return '<p class="muted" style="font-size:13px">Sem dados ainda.</p>';
  const max = Math.max(...rows.map(r=>r.qtd));
  return rows.map(r=>`
    <div style="margin-bottom:8px">
      <div class="flex between" style="font-size:12px;margin-bottom:2px"><span>${esc(r.chave)}</span><span class="muted">${r.qtd} atestado(s)${sufixo?(' · '+r.dias+' dia(s)'):''}</span></div>
      <div class="stackbar"><div style="width:${(r.qtd/max*100)}%;background:${corBarra}"></div></div>
    </div>`).join("");
}

function calcularEvolucaoMensal(list){
  const meses = {};
  const agora = new Date();
  for(let i=11; i>=0; i--){
    const d = new Date(agora);
    d.setMonth(d.getMonth()-i);
    const mes = d.toISOString().slice(0,7);
    meses[mes] = 0;
  }
  list.forEach(a=>{
    const mes = a.data_inicio.slice(0,7);
    if(mes in meses) meses[mes]++;
  });
  return Object.entries(meses).map(([mes, total])=>({mes, total}));
}
function calcularTopColaboradores(list, limite){
  const byColab = {};
  list.forEach(a=>{
    if(!byColab[a.colaborador]) byColab[a.colaborador] = {total:0, dias:0};
    byColab[a.colaborador].total++;
    byColab[a.colaborador].dias += a.dias;
  });
  return Object.entries(byColab)
    .map(([colaborador, data])=>({colaborador, ...data}))
    .sort((a,b)=>b.dias-a.dias)
    .slice(0, limite);
}
function computeAlertas(list){
  const alerts=[]; const byKey={};
  list.forEach(a=>{ const k=a.colaborador+"|"+a.cid; (byKey[k]=byKey[k]||[]).push(a); });
  Object.values(byKey).forEach(items=>{
    items.sort((a,b)=>a.data_inicio.localeCompare(b.data_inicio));
    items.forEach(a=>{ if(a.dias>15) alerts.push({colaborador:a.colaborador,setor:a.setor,cid:a.cid,motivo:"individual",detalhe:`Atestado de ${a.dias} dias — acima de 15, gera afastamento por INSS.`}); });
    for(let i=0;i<items.length;i++){
      const ref=items[i]; const refEnd=new Date(ref.data_fim); const ws=new Date(refEnd); ws.setDate(ws.getDate()-59); const wsStr=ws.toISOString().slice(0,10);
      const involved=items.filter(x=>x.data_inicio>=wsStr && x.data_inicio<=ref.data_fim);
      const soma=involved.reduce((s,x)=>s+x.dias,0);
      if(soma>15 && involved.length>1){
        const dup = alerts.some(al=>al.motivo==="acumulo"&&al.colaborador===ref.colaborador&&al.cid===ref.cid&&al._n===involved.length);
        if(!dup) alerts.push({colaborador:ref.colaborador,setor:ref.setor,cid:ref.cid,motivo:"acumulo",detalhe:`Soma de ${soma} dias em atestados com o mesmo CID, em até 60 dias.`,_n:involved.length});
      }
    }
  });
  return alerts;
}

/* ---------------- estágio / aprendiz ---------------- */
const LIMITE_DIAS_CONTRATO = 730; // 2 anos
const AVISO_DIAS_LIMITE = 630;    // ~21 meses, começa a alertar
const AVISO_VENCIMENTO = 30;      // dias antes do fim previsto para alertar
function computeAlertasContrato(list){
  const hoje = todayISO();
  const alerts = [];
  list.forEach(c=>{
    const diasRestantes = daysBetween(hoje, c.data_fim_prevista);
    const diasTotais = daysBetween(c.data_inicio, hoje);
    if(diasRestantes<0){
      alerts.push({...c, motivo:"vencido", detalhe:`Contrato venceu há ${-diasRestantes} dia(s) — regularizar (efetivar ou desligar).`});
    } else if(diasRestantes<=AVISO_VENCIMENTO){
      alerts.push({...c, motivo:"vencendo", detalhe:`Contrato vence em ${diasRestantes} dia(s) (${fmt(c.data_fim_prevista)}).`});
    }
    if(diasTotais>=LIMITE_DIAS_CONTRATO){
      const rotulo = c.tipo==="estagio"? "estágio (Lei 11.788/2008)" : "aprendizagem (Art. 428 da CLT)";
      alerts.push({...c, motivo:"limite-legal", detalhe:`Já passou de 2 anos de ${rotulo} — limite legal ultrapassado, regularizar imediatamente.`});
    } else if(diasTotais>=AVISO_DIAS_LIMITE){
      const rotulo = c.tipo==="estagio"? "estágio" : "aprendizagem";
      alerts.push({...c, motivo:"perto-limite", detalhe:`Está com ${diasTotais} dias de ${rotulo} — se aproximando do limite legal de 2 anos.`});
    }
  });
  return alerts;
}

const IMPORT_SPECS = {
  atestados: {
    titulo: "Importar atestados",
    colunas: ["colaborador","filial","setor","cid","data_inicio","data_fim","observacao"],
    obrigatorias: ["colaborador","cid","data_inicio","data_fim"],
    exemplo: ["Maria Silva","Filial SP","Comercial","M54.5","01/03/2026","10/03/2026","Lombalgia"],
  },

    exemplo: ["João Souza","Filial RJ","TI","estagio","01/02/2026","01/02/2027",""],
  },
};
function parseDataFlex(v){
  if(!v) return null;
  v = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function renderImportModal(kind){
  const spec = IMPORT_SPECS[kind];
  return `<div class="overlay" data-action="close-import-bg"><div class="modal" style="max-width:480px">
    <div class="flex between" style="margin-bottom:10px"><h2 style="margin:0;font-size:17px">${spec.titulo}</h2><button class="link" data-action="close-import">✕</button></div>
    <p class="muted" style="font-size:12px;margin:0 0 8px">O arquivo CSV precisa ter estas colunas na primeira linha (nessa ordem, nomes exatos):</p>
    <p style="font-size:12px;background:var(--paper);padding:8px;border:1px solid var(--line);word-break:break-all">${spec.colunas.join(", ")}</p>
    <p class="muted" style="font-size:11px;margin:6px 0 10px">Obrigatórias: ${spec.obrigatorias.join(", ")}. Datas em DD/MM/AAAA ou AAAA-MM-DD. Deixe as outras células vazias se não tiver o dado.</p>
    <button class="link" style="font-size:12px;padding:0;margin-bottom:10px" data-action="baixar-modelo" data-import="${kind}">⬇ baixar modelo CSV de exemplo</button>
    <input type="file" id="importFile" accept=".csv" style="width:100%;margin-bottom:10px">
    <div id="importPreview" class="muted" style="font-size:12px;min-height:16px;margin-bottom:10px"></div>
    <div class="flex gap8" style="justify-content:flex-end">
      <button data-action="close-import">Cancelar</button>
      <button class="primary" data-action="confirmar-import" data-import="${kind}">Importar</button>
    </div>
  </div></div>`;
}
function baixarModelo(kind){
  const spec = IMPORT_SPECS[kind];
  const csv = spec.colunas.join(",")+"\n"+spec.exemplo.join(",");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "modelo_"+kind+".csv"; a.click();
}
function confirmarImport(kind){
  const fileInput = document.getElementById("importFile");
  const preview = document.getElementById("importPreview");
  const spec = IMPORT_SPECS[kind];
  const file = fileInput.files[0];
  if(!file){ preview.textContent = "Escolha um arquivo CSV primeiro."; preview.style.color = C.danger; return; }
  if(/\.xlsx?$/i.test(file.name)){
    preview.textContent = "Esse arquivo parece ser Excel (.xlsx), não CSV. No Excel/Sheets, use 'Salvar como' > 'CSV (UTF-8)' e importe o arquivo .csv gerado.";
    preview.style.color = C.danger; return;
  }
  preview.textContent = "Lendo arquivo..."; preview.style.color = "";
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    error: (err)=>{ console.error("Erro no Papa.parse:", err); preview.textContent = "Erro ao ler o CSV: "+err.message; preview.style.color = C.danger; },
    complete: async (res)=>{
      try{
        const rows = res.data;
        if(!rows.length){ preview.textContent = "O arquivo está vazio ou não tem linhas de dados."; preview.style.color = C.danger; return; }
        const colunasArquivo = res.meta && res.meta.fields || [];
        const faltandoColuna = spec.obrigatorias.filter(c=> !colunasArquivo.includes(c));
        if(faltandoColuna.length){
          preview.textContent = `O cabeçalho do CSV não tem a(s) coluna(s): ${faltandoColuna.join(", ")}. Colunas encontradas: ${colunasArquivo.join(", ")||"(nenhuma)"}.`;
          preview.style.color = C.danger; return;
        }
        const linhasValidas = []; const erros = [];
        rows.forEach((r,i)=>{
          const faltando = spec.obrigatorias.filter(c=> !r[c] || !String(r[c]).trim());
          if(faltando.length){ erros.push(`Linha ${i+2}: faltando ${faltando.join(", ")}`); return; }
          const linha = {};
          spec.colunas.forEach(c=> linha[c] = (r[c]||"").toString().trim() || null);
          const camposData = kind==="atestados"? ["data_inicio","data_fim"] : ["data_inicio","data_fim_prevista"];
          let dataOk = true;
          camposData.forEach(c=>{ if(linha[c]){ const d=parseDataFlex(linha[c]); if(!d){ dataOk=false; erros.push(`Linha ${i+2}: data inválida em "${c}" (${linha[c]})`); } else linha[c]=d; } });
          if(!dataOk) return;
          linhasValidas.push(linha);
        });
        if(!linhasValidas.length){ preview.textContent = "Nenhuma linha válida encontrada. "+(erros[0]||""); preview.style.color = C.danger; return; }
        preview.textContent = `Importando ${linhasValidas.length} linha(s)...`; preview.style.color = "";
        const tabela = kind==="atestados"? "atestados" : "contratos_prazo";
        const {error} = await sb.from(tabela).insert(linhasValidas);
        if(error){ console.error("Erro Supabase:", error); preview.textContent = "Erro ao importar: "+error.message; preview.style.color = C.danger; return; }
        preview.textContent = `${linhasValidas.length} linha(s) importada(s) com sucesso!` + (erros.length? ` (${erros.length} linha(s) ignorada(s) por erro)`:"");
        preview.style.color = C.ok;
        setTimeout(()=>{ ui.showImport=null; render(); }, 1400);
      }catch(e){
        console.error("Erro inesperado na importação:", e);
        preview.textContent = "Erro inesperado: "+e.message+" (veja o console pra detalhes)";
        preview.style.color = C.danger;
      }
    }
  });
}

    <div class="etapa-drag-item" draggable="true" data-tipo="${tipo}" data-step-id="${s.id}" data-index="${i}" style="padding:10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;cursor:move;background:var(--card);transition:all 0.15s">

      <input value="${esc(s.label)}" style="flex:1;border-bottom:1px solid transparent;transition:all 0.15s" onchange="renameStep('${tipo}','${s.id}', this.value)">
      <button class="link" data-action="remove-step" data-tipo="${tipo}" data-step="${s.id}" style="color:var(--danger)">✕</button>
    </div>
  `).join("")}
  </div>
  <div class="flex gap8">
    <input id="novoStepInput" placeholder="+ Nova etapa..." style="flex:1;border-radius:4px">
    <button class="primary" data-action="add-step">Adicionar</button>
  </div>`;
  
  setTimeout(() => setupDragDrop(tipo), 0);
  return html;
}
function renderFiliaisConfig(){
  if(!isAdmin) return `<p style="font-weight:600;margin-top:0">Filiais</p>${filiaisList.map(f=>`<p style="padding:6px 0;border-bottom:1px solid var(--line)">${esc(f)}</p>`).join("")}`;
  return `<p style="font-weight:600;margin-top:0">Filiais</p>
  <div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px">${filiaisList.map(f=>`<div class="flex between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(f)}</span><button class="link" data-action="remove-filial" data-filial="${esc(f)}">excluir</button></div>`).join("") || '<p class="muted" style="padding:6px 0">Nenhuma filial cadastrada ainda.</p>'}</div>
  <div class="flex gap8"><input id="novoFilialInput" placeholder="Nova filial..." style="flex:1"><button class="primary" data-action="add-filial">Adicionar</button></div>`;
}
function renderSetoresConfig(){
  if(!isAdmin) return `<p style="font-weight:600;margin-top:0">Setores</p>${setoresFull.map(s=>`<p style="padding:6px 0;border-bottom:1px solid var(--line)">${esc(s.nome)} <span class="muted" style="font-size:12px">(${s.filiais&&s.filiais.length?esc(s.filiais.join(", ")):"todas as filiais"})</span></p>`).join("")}`;
  return `<p style="font-weight:600;margin-top:0">Setores</p>
  <div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px">
  ${setoresFull.map(s=>`<div class="flex between" style="padding:6px 0;border-bottom:1px solid var(--line)">
    <span>${esc(s.nome)} <span class="muted" style="font-size:12px">(${s.filiais&&s.filiais.length?esc(s.filiais.join(", ")):"todas as filiais"})</span></span>
    <button class="link" data-action="remove-setor" data-setor="${esc(s.nome)}">excluir</button>
  </div>`).join("") || '<p class="muted" style="padding:6px 0">Nenhum setor cadastrado ainda.</p>'}
  </div>
  <p class="muted" style="font-size:12px;margin-bottom:6px">Novo setor — marque as filiais específicas, ou deixe todas desmarcadas para ficar disponível em todas as filiais.</p>
  <div class="flex wrap gap8" style="margin-bottom:8px">
  ${filiaisList.map(f=>`<label style="font-size:12px"><input type="checkbox" class="novoSetorFilialChk" value="${esc(f)}"> ${esc(f)}</label>`).join("") || '<span class="muted" style="font-size:12px">Cadastre as filiais primeiro na aba 🏢 Filiais.</span>'}
  </div>
  <div class="flex gap8"><input id="novoSetorInput" placeholder="Nome do novo setor..." style="flex:1"><button class="primary" data-action="add-setor">Adicionar</button></div>`;
}

/* ---------------- ações (Supabase) ---------------- */
async function toggleStep(procId, stepId){
  const p = processos.find(x=>x.id===procId); if(!p) return;
  const tpl = templates[p.tipo];
  const cur = (p.etapas&&p.etapas[stepId]) || {done:false,em:null,obs:""};
  const done = !cur.done;
  const etapas = Object.assign({}, p.etapas, {[stepId]: {done, em: done?todayISO():null, obs:cur.obs||""}});
  const allDone = tpl.steps.every(s=> etapas[s.id] && etapas[s.id].done);
  await sb.from("processos").update({etapas, data_conclusao: allDone? (p.data_conclusao||todayISO()) : null}).eq("id", procId);
}
window.setObs = async (procId, stepId, val)=>{ const p=processos.find(x=>x.id===procId); const etapas=Object.assign({}, p.etapas, {[stepId]: Object.assign({}, p.etapas[stepId], {obs:val})}); await sb.from("processos").update({etapas}).eq("id",procId); };
window.setPrazo = async (procId, val)=>{ await sb.from("processos").update({prazo: val||null}).eq("id",procId); };
window.setSetor = async (procId, val)=>{ await sb.from("processos").update({setor: val||null}).eq("id",procId); };
window.setFilial = async (procId, val)=>{ await sb.from("processos").update({filial: val||null}).eq("id",procId); };
window.setAviso = async (procId, campo, val)=>{ await sb.from("processos").update({[campo]: val||null}).eq("id",procId); };
window.setConf = async (procId, val)=>{ await sb.from("confidencial").upsert({processo_id:procId, texto:val}); };
window.renameStep = async (tipo, stepId, val)=>{ const steps=templates[tipo].steps.map(s=>s.id===stepId?{id:s.id,label:val}:s); await sb.from("templates").update({steps}).eq("id",tipo); };

async function criarProcesso(){
  const tipo=document.getElementById("novoTipo").value, colaborador=document.getElementById("novoColab").value.trim();
  const setor=document.getElementById("novoSetor").value, filial=document.getElementById("novoFilial").value;
  const data_abertura=document.getElementById("novoAbertura").value||todayISO(), prazo=document.getElementById("novoPrazo").value||null;
  if(!colaborador) return;
  const etapas={}; templates[tipo].steps.forEach(s=>etapas[s.id]={done:false,em:null,obs:""});
  const {error} = await sb.from("processos").insert({tipo,colaborador,setor,filial,data_abertura,prazo,etapas});
  if(!error){ ui.showNovo=false; render(); }
}
async function removerProcesso(id){ await sb.from("processos").delete().eq("id",id); ui.selectedId=null; render(); }
async function addStep(){ const val=document.getElementById("novoStepInput").value.trim(); if(!val) return; const tipo=ui.configTipo; const steps=templates[tipo].steps.concat([{id:"s"+Math.random().toString(36).slice(2,9), label:val}]); await sb.from("templates").update({steps}).eq("id",tipo); }
async function removeStep(tipo, stepId){ const steps=templates[tipo].steps.filter(s=>s.id!==stepId); await sb.from("templates").update({steps}).eq("id",tipo); }
async function moveStep(tipo, index, dir){ const steps=templates[tipo].steps.slice(); const t=index+dir; if(t<0||t>=steps.length) return; [steps[index],steps[t]]=[steps[t],steps[index]]; await sb.from("templates").update({steps}).eq("id",tipo); }
async function addSetor(){
  const val=document.getElementById("novoSetorInput").value.trim(); if(!val) return;
  const filiais = Array.from(document.querySelectorAll(".novoSetorFilialChk:checked")).map(el=>el.value);
  const {error} = await sb.from("setores").insert({nome:val, filiais});
  if(error) alert("Erro ao adicionar setor: "+error.message);
}
async function removeSetor(nome){ await sb.from("setores").delete().eq("nome",nome); }
async function addFilial(){
  const val=document.getElementById("novoFilialInput").value.trim(); if(!val) return;
  const {error} = await sb.from("filiais").insert({nome:val});
  if(error) alert("Erro ao adicionar filial: "+error.message);
}
async function removeFilial(nome){ await sb.from("filiais").delete().eq("nome",nome); }
async function addAtestado(){
  const colaborador=document.getElementById("atColab").value.trim(), setor=document.getElementById("atSetor").value, filial=document.getElementById("atFilial").value, cid=document.getElementById("atCid").value.trim();
  const data_inicio=document.getElementById("atInicio").value, data_fim=document.getElementById("atFim").value, observacao=document.getElementById("atObs").value.trim();
  if(!colaborador||!cid||!data_inicio||!data_fim) return;
  await sb.from("atestados").insert({colaborador,setor,filial,cid,data_inicio,data_fim,observacao});
}
async function removeAtestado(id){ await sb.from("atestados").delete().eq("id",id); }
async function abrirProcessoAfastamento(colaborador, setor, cid, motivo){
  const etapas={}; templates["afastamento"].steps.forEach(s=>etapas[s.id]={done:false,em:null,obs:""});
  const {data} = await sb.from("processos").insert({tipo:"afastamento",colaborador,setor,data_abertura:todayISO(),etapas}).select().single();
  if(data){ await sb.from("confidencial").upsert({processo_id:data.id, texto:`CID: ${cid} — aberto automaticamente (${motivo==="individual"?"atestado > 15 dias":"acúmulo em 60 dias"})`});
    ui.view="processos"; ui.selectedId=data.id; render(); }
}

/* ---------------- auth ---------------- */
async function doLogin(){
  const email=document.getElementById("authEmail").value.trim(), password=document.getElementById("authPass").value;
  const {error} = await sb.auth.signInWithPassword({email,password});
  if(error) document.getElementById("authError").textContent = error.message;
}
async function doSignup(){
  const email=document.getElementById("authEmail").value.trim(), password=document.getElementById("authPass").value;
  const {error} = await sb.auth.signUp({email,password});
  if(error) document.getElementById("authError").textContent = error.message;
  else document.getElementById("authError").textContent = "Conta criada! Já pode entrar.";
}

/* ---------------- drag and drop para etapas ---------------- */
let draggedItem = null;
function setupDragDrop(tipo){
  const container = document.querySelector(`.etapas-container[data-tipo="${tipo}"]`);
  if(!container) return;
  const items = container.querySelectorAll(".etapa-drag-item");
  items.forEach(item => {
    item.addEventListener("dragstart", (e) => {
      draggedItem = item;
      item.style.opacity = "0.5";
      e.dataTransfer.effectAllowed = "move";
    });
    item.addEventListener("dragend", (e) => {
      item.style.opacity = "1";
      items.forEach(el => el.style.borderTop = "");
    });
    item.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (draggedItem && draggedItem !== item) {
        item.style.borderTop = "2px solid var(--steel)";
      }
    });
    item.addEventListener("dragleave", (e) => {
      item.style.borderTop = "";
    });
    item.addEventListener("drop", async (e) => {
      e.preventDefault();
      item.style.borderTop = "";
      if (draggedItem && draggedItem !== item) {
        const dragIndex = parseInt(draggedItem.dataset.index);
        const dropIndex = parseInt(item.dataset.index);
        const tipoDrag = draggedItem.dataset.tipo;
        const tpl = templates[tipoDrag];
        const steps = tpl.steps.slice();
        const [moved] = steps.splice(dragIndex, 1);
        steps.splice(dropIndex, 0, moved);
        await sb.from("templates").update({steps}).eq("id", tipoDrag);
      }
    });
  });
}

/* ---------------- eventos ---------------- */
document.addEventListener("click", (e)=>{
  const bg=e.target.dataset.action==='close-detail-bg'?e.target:null; if(bg){ ui.selectedId=null; render(); return; }
  const bg2=e.target.dataset.action==='close-novo-bg'?e.target:null; if(bg2){ ui.showNovo=false; render(); return; }
  const bg3=e.target.dataset.action==='close-import-bg'?e.target:null; if(bg3){ ui.showImport=null; render(); return; }
  const el=e.target.closest("[data-action]"); if(!el) return;
  const a=el.dataset.action;
  if(a==="set-view"){ ui.view=el.dataset.view; ui.selectedId=null; render(); }
  else if(a==="open-novo"){ ui.showNovo=true; render(); }
  else if(a==="close-novo"){ ui.showNovo=false; render(); }
  else if(a==="criar-processo"){ criarProcesso(); }
  else if(a==="open-detail"){ ui.selectedId=el.dataset.id; render(); }
  else if(a==="close-detail"){ ui.selectedId=null; render(); }
  else if(a==="toggle-step"){ toggleStep(el.dataset.id, el.dataset.step); }
  else if(a==="remove-processo"){ removerProcesso(el.dataset.id); }
  else if(a==="add-step"){ addStep(); }
  else if(a==="remove-step"){ removeStep(el.dataset.tipo, el.dataset.step); }
  else if(a==="move-step"){ moveStep(el.dataset.tipo, parseInt(el.dataset.index), parseInt(el.dataset.dir)); }
  else if(a==="set-config-tipo"){ ui.configTipo=el.dataset.tipo; render(); }
  else if(a==="add-setor"){ addSetor(); }
  else if(a==="remove-setor"){ removeSetor(el.dataset.setor); }
  else if(a==="add-filial"){ addFilial(); }
  else if(a==="remove-filial"){ removeFilial(el.dataset.filial); }
  else if(a==="open-import"){ ui.showImport=el.dataset.import; render(); }
  else if(a==="close-import"){ ui.showImport=null; render(); }
  else if(a==="baixar-modelo"){ baixarModelo(el.dataset.import); }
  else if(a==="confirmar-import"){ confirmarImport(el.dataset.import); }
  else if(a==="add-movimentacao"){ addMovimentacao(); }
  else if(a==="remove-movimentacao"){ removeMovimentacao(el.dataset.id); }
  else if(a==="add-atestado"){ addAtestado(); }
  else if(a==="remove-atestado"){ removeAtestado(el.dataset.id); }
  else if(a==="abrir-afastamento"){ abrirProcessoAfastamento(el.dataset.colaborador, el.dataset.setor, el.dataset.cid, el.dataset.motivo); }
  else if(a==="add-contrato"){ addContrato(); }
  else if(a==="remove-contrato"){ removeContrato(el.dataset.id); }
  else if(a==="abrir-efetivacao"){ abrirProcessoSimples("admissao_clt", el.dataset.colaborador, el.dataset.setor); }
  else if(a==="abrir-desligamento-estagio"){ abrirProcessoSimples("rescisao_estagio", el.dataset.colaborador, el.dataset.setor); }
  else if(a==="logout"){ sb.auth.signOut(); }
  else if(a==="do-login"){ doLogin(); }
  else if(a==="do-signup"){ doSignup(); }
  else if(a==="toggle-auth"){ authMode = authMode==="login"?"signup":"login"; render(); }
});
document.addEventListener("change",(e)=>{ const el=e.target.closest("[data-action-change]"); if(!el) return; ui[el.dataset.actionChange]=el.value; render(); });

/* ---------------- carregar dados + realtime ---------------- */
async function loadAll(){
  const {data:tRows} = await sb.from("templates").select("*");
  templates = {}; (tRows||[]).forEach(r=> templates[r.id] = {label:r.label, steps:r.steps});
  const {data:sRows} = await sb.from("setores").select("*").order("nome");
  setoresFull = (sRows||[]).map(r=>({nome:r.nome, filiais:r.filiais||[]}));
  const {data:fRows} = await sb.from("filiais").select("*").order("nome");
  filiaisList = (fRows||[]).map(r=>r.nome);
  const {data:pRows} = await sb.from("processos").select("*").order("criado_em",{ascending:false});
  processos = pRows||[];
  const {data:ctRows} = await sb.from("contratos_prazo").select("*");
  contratosPrazo = ctRows||[];
  const {data:adminCheck} = await sb.from("admins").select("email").eq("email", session.user.email).maybeSingle();
  isAdmin = !!adminCheck;
  if(isAdmin){
    const {data:cRows} = await sb.from("confidencial").select("*");
    confMap = {}; (cRows||[]).forEach(r=> confMap[r.processo_id]=r.texto);
    const {data:aRows} = await sb.from("atestados").select("*");
    atestados = aRows||[];
    const {data:mRows} = await sb.from("movimentacoes").select("*");
    movimentacoes = mRows||[];
  }
  render();
  subscribeRealtime();
}
let channelsWired=false;
function subscribeRealtime(){
  if(channelsWired) return; channelsWired=true;
  sb.channel("db-changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"processos"}, async ()=>{ const {data}=await sb.from("processos").select("*").order("criado_em",{ascending:false}); processos=data||[]; render(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"templates"}, async ()=>{ const {data}=await sb.from("templates").select("*"); templates={}; (data||[]).forEach(r=>templates[r.id]={label:r.label,steps:r.steps}); render(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"setores"}, async ()=>{ const {data}=await sb.from("setores").select("*").order("nome"); setoresFull=(data||[]).map(r=>({nome:r.nome, filiais:r.filiais||[]})); render(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"filiais"}, async ()=>{ const {data}=await sb.from("filiais").select("*").order("nome"); filiaisList=(data||[]).map(r=>r.nome); render(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"confidencial"}, async ()=>{ if(!isAdmin) return; const {data}=await sb.from("confidencial").select("*"); confMap={}; (data||[]).forEach(r=>confMap[r.processo_id]=r.texto); render(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"atestados"}, async ()=>{ if(!isAdmin) return; const {data}=await sb.from("atestados").select("*"); atestados=data||[]; render(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"movimentacoes"}, async ()=>{ if(!isAdmin) return; const {data}=await sb.from("movimentacoes").select("*"); movimentacoes=data||[]; render(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"contratos_prazo"}, async ()=>{ const {data}=await sb.from("contratos_prazo").select("*"); contratosPrazo=data||[]; render(); })
    .subscribe();
}

(async function init(){
  const {data:{session:s}} = await sb.auth.getSession();
  session = s; render();
  if(session) loadAll();
  sb.auth.onAuthStateChange((event, s2)=>{
    session = s2;
    if(event==="SIGNED_IN"){ loadAll(); }
    else render();
  });
})();
</script>
